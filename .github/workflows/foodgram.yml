name: Foodgram CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      env:
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-secret-key
        DEBUG: 'True'
      run: |
        cd backend
        python manage.py migrate --noinput

    - name: Run tests
      env:
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-secret-key
        DEBUG: 'True'
      run: |
        cd backend
        python manage.py test --noinput

  build_and_push_to_docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          mkdir -p ~/foodgram
          cd ~/foodgram
          
          if [ ! -d ".git" ]; then
            git clone https://github.com/KristianIovu/foodgram.git .
          else
            git pull origin main
          fi
          
          cd infra
          
          if [ ! -f ".env.prod" ]; then
            echo "POSTGRES_DB=foodgram" > .env.prod
            echo "POSTGRES_USER=foodgram_user" >> .env.prod
            echo "POSTGRES_PASSWORD=\$(openssl rand -base64 32)" >> .env.prod
            echo "DB_HOST=db" >> .env.prod
            echo "DB_PORT=5432" >> .env.prod
            echo "SECRET_KEY=\$(openssl rand -base64 64)" >> .env.prod
            echo "DEBUG=False" >> .env.prod
            echo "ALLOWED_HOSTS=localhost,127.0.0.1,158.160.23.227" >> .env.prod
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env.prod
          fi
          
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d
          
          sleep 10
          docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput
          docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput
          docker compose -f docker-compose.prod.yml exec -T backend python manage.py load_ingredients --path /app/data/ingredients.json
          
          echo "Деплой завершен! Проект доступен по http://158.160.23.227"
