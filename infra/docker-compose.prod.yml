services:
  db:
    image: postgres:13.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env

  backend:
    image: ${DOCKER_USERNAME}/foodgram_backend:latest
    restart: always
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
    depends_on:
      - db
    env_file:
      - .env

  nginx:
    image: nginx:1.25.4-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/html/static:ro
      - media_volume:/var/html/media:ro
      - ./frontend_static:/usr/share/nginx/html/frontend:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
